[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clipscope"
version = "0.2.0"
description = "ClipScope: local-first short-video archive toolkit for Douyin, TikTok, and Bilibili"
requires-python = ">=3.11"
dependencies = [
    "aiofiles",
    "httpx<0.28",
    "pyyaml",
    "pydantic",
    "pycryptodomex",
    "tenacity",
    "gmssl",
    "rich",
    "qrcode",
    "pypng",
    "browser-cookie3",
    "importlib_resources",
]

[project.scripts]
douyin = "clipscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi"]
extend-exclude = [
    ".venv/",
    "data/",
    "__pycache__/",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "RUF",       # ruff-specific
]
ignore = [
    "E501",      # 行长度由 formatter 处理
    "D100",      # 模块级 docstring 可选
    "D104",      # __init__ docstring 可选
    "D107",      # __init__ 方法 docstring 可选
    "RUF001",    # 中文全角标点属于正常使用
    "RUF002",    # 同上
    "RUF003",    # 同上
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/clipscope"]
omit = [".venv/*", "tests/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
]

[tool.ruff.lint.per-file-ignores]
"src/clipscope/crawler/**/*.py" = ["ALL"]
"tests/*.py" = ["D100", "D101", "D102", "D103", "D104", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
